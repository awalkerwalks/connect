<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect 🔥</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0b0b;
    --accent-her: #e84560;
    --accent-him: #4572e8;
    --gold: #c9a84c;
    --light-col: #5bbf7a;
    --warm-col: #e8944a;
    --hot-col: #e84560;
    --text: #f0ece6;
    --muted: #7a7068;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 80px;
    background-image:
      radial-gradient(ellipse at 15% 10%, #2a0a1844 0%, transparent 55%),
      radial-gradient(ellipse at 85% 90%, #0a1a2a44 0%, transparent 55%);
  }
  header { text-align: center; margin-bottom: 18px; }
  header h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(2.4rem, 9vw, 3.6rem);
    font-weight: 700; letter-spacing: -1px; line-height: 1;
    background: linear-gradient(135deg, var(--accent-her) 0%, var(--gold) 50%, var(--accent-him) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  header p { font-size: 0.74rem; color: var(--muted); margin-top: 6px; letter-spacing: 0.8px; text-transform: uppercase; }

.rules {
background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
border-radius: 12px; padding: 12px 16px; max-width: 480px; width: 100%;
margin-bottom: 18px; font-size: 0.78rem; color: var(--muted); line-height: 1.7;
}
.rules strong { color: var(--gold); font-weight: 500; }

/* PLAYER */
.player-select { display: flex; gap: 10px; margin-bottom: 14px; width: 100%; max-width: 480px; }
.player-btn {
flex: 1; padding: 12px; border-radius: 10px; border: 1.5px solid transparent;
font-family: 'DM Sans', sans-serif; font-size: 0.86rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease;
display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden;
}
.player-btn.her { background: rgba(232,69,96,0.08); border-color: rgba(232,69,96,0.3); color: var(--accent-her); }
.player-btn.him { background: rgba(69,114,232,0.08); border-color: rgba(69,114,232,0.3); color: var(--accent-him); }
.cycle-arrow { font-size: 1.5rem; opacity: 0.5; padding: 0 6px; cursor: pointer; display: flex; align-items: center; }
 .cycle-arrow:hover { opacity: 1; }
.player-btn.active.her { background: var(--accent-her); color: white; border-color: var(--accent-her); }
.player-btn.active.him { background: var(--accent-him); color: white; border-color: var(--accent-him); }

/* CATEGORY */
.cat-select { display: flex; gap: 8px; margin-bottom: 14px; width: 100%; max-width: 480px; }
.cat-btn {
flex: 1; padding: 10px 4px; border-radius: 10px; border: 1.5px solid transparent;
font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 500;
cursor: pointer; transition: all 0.2s ease; text-align: center; line-height: 1.3;
}
.cat-btn .cat-emoji { display: block; font-size: 1.15rem; margin-bottom: 2px; }
.cat-btn .cat-sub { display: block; font-size: 0.6rem; letter-spacing: 0.4px; opacity: 0.7; margin-top: 1px; }
.cat-btn.light { background: rgba(91,191,122,0.08); border-color: rgba(91,191,122,0.3); color: var(--light-col); }
.cat-btn.warm  { background: rgba(232,148,74,0.08);  border-color: rgba(232,148,74,0.3); color: var(--warm-col); }
.cat-btn.hot   { background: rgba(232,69,96,0.08);   border-color: rgba(232,69,96,0.3);  color: var(--hot-col); }
.cat-btn.mix   { background: rgba(201,168,76,0.08);  border-color: rgba(201,168,76,0.3); color: var(--gold); }
.cat-btn.active.light { background: var(--light-col); color: #0d1a10; border-color: var(--light-col); }
.cat-btn.active.warm  { background: var(--warm-col);  color: #1a0e04; border-color: var(--warm-col); }
.cat-btn.active.hot   { background: var(--hot-col);   color: white;   border-color: var(--hot-col); }
.cat-btn.active.mix   { background: var(--gold);      color: #1a1408; border-color: var(--gold); }
.cat-btn.active .cat-sub { opacity: 0.6; }

/* PROGRESS */
.progress-row { display: flex; gap: 6px; width: 100%; max-width: 480px; margin-bottom: 14px; }
.progress-pill {
flex: 1; padding: 7px 4px; border-radius: 8px; font-size: 0.67rem;
text-align: center; background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.06); color: var(--muted); cursor: pointer; transition: all 0.15s ease;
}
.progress-pill:hover { background: rgba(255,255,255,0.06); }
.progress-pill .p-num { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 1px; }
.progress-pill.light .p-num { color: var(--light-col); }
.progress-pill.warm  .p-num { color: var(--warm-col); }
.progress-pill.hot   .p-num { color: var(--hot-col); }
.progress-pill.mix   .p-num { color: var(--gold); }

/* TIMER */
.timer-wrap { width: 100%; max-width: 480px; margin-bottom: 14px; }
.timer-display {
display: flex; align-items: center; justify-content: space-between;
background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
border-radius: 12px; padding: 11px 14px; gap: 12px;
}
.timer-number {
font-family: 'Fraunces', serif; font-size: 1.9rem; font-weight: 700;
letter-spacing: -1px; min-width: 58px; color: var(--gold); transition: color 0.3s ease;
}
.timer-number.urgent { color: var(--hot-col); animation: pulse 0.6s ease infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }
.timer-bar-wrap { flex: 1; height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
.timer-bar { height: 100%; border-radius: 2px; transition: width 1s linear, background 1s ease; background: var(--gold); width: 100%; }
.timer-controls { display: flex; gap: 6px; }
.timer-btn {
padding: 7px 12px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.1);
background: rgba(255,255,255,0.04); color: var(--text);
font-family: 'DM Sans', sans-serif; font-size: 0.75rem; cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
}
.timer-btn:hover { background: rgba(255,255,255,0.09); }

/* CARD */
.card-area { width: 100%; max-width: 480px; margin-bottom: 10px; min-height: 200px; display: flex; flex-direction: column; }
.card {
width: 100%; border-radius: 18px; padding: 26px 22px; position: relative;
overflow: hidden; cursor: pointer; min-height: 200px; display: flex;
flex-direction: column; justify-content: space-between;
transition: transform 0.15s ease; user-select: none;
}
.card:active { transform: scale(0.98); }
.card::before {
content: ''; position: absolute; inset: 0; opacity: 0.03;
background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff'%3E%3Cpath d='M20 20.5V18H0v5h5v5H0v5h20v-2.5h20V20.5H20z'/%3E%3C/g%3E%3C/svg%3E");
}
.card.light-card { background: linear-gradient(135deg,#0d1f14,#091509); border: 1px solid rgba(91,191,122,0.25); box-shadow: 0 8px 40px rgba(91,191,122,0.1); }
.card.warm-card  { background: linear-gradient(135deg,#1f1308,#150d05); border: 1px solid rgba(232,148,74,0.25); box-shadow: 0 8px 40px rgba(232,148,74,0.1); }
.card.hot-card   { background: linear-gradient(135deg,#20080f,#150508); border: 1px solid rgba(232,69,96,0.25);  box-shadow: 0 8px 40px rgba(232,69,96,0.12); }
.card.mix-card   { background: linear-gradient(135deg,#1a1408,#120f04); border: 1px solid rgba(201,168,76,0.25); box-shadow: 0 8px 40px rgba(201,168,76,0.1); }
.card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.card-label { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 500; color: rgba(255,255,255,0.4); }
.light-card .card-label { color: var(--light-col); }
.warm-card  .card-label { color: var(--warm-col); }
.hot-card   .card-label { color: var(--hot-col); }
.mix-card   .card-label { color: var(--gold); }
.cat-badge {
font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1.5px;
padding: 3px 9px; border-radius: 20px; font-weight: 500; margin-left: auto;
}
.light-card .cat-badge { background: rgba(91,191,122,0.15); color: var(--light-col); }
.warm-card  .cat-badge { background: rgba(232,148,74,0.15); color: var(--warm-col); }
.hot-card   .cat-badge { background: rgba(232,69,96,0.15);  color: var(--hot-col); }
.mix-card   .cat-badge { background: rgba(201,168,76,0.15); color: var(--gold); }
.question-text {
font-family: 'Fraunces', serif; font-size: clamp(1.08rem,3.8vw,1.3rem);
line-height: 1.55; font-style: italic; flex: 1; display: flex; align-items: center;
color: var(--text);
}
.card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
.card-counter { font-size: 0.7rem; color: var(--muted); }
.card-hint { font-size: 0.68rem; color: var(--muted); font-style: italic; }

/* ACTIONS */
.action-row { display: flex; gap: 8px; width: 100%; max-width: 480px; margin-bottom: 8px; }
.next-btn {
flex: 2; padding: 10px 15px; border-radius: 10px; border: none;
font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 500; cursor: pointer; transition: all 0.18s ease;
display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.next-btn.light { background: var(--light-col); color: #0d1a10; }
.next-btn.warm  { background: var(--warm-col);  color: #1a0e04; }
.next-btn.hot   { background: var(--hot-col);   color: white; }
.next-btn.mix   { background: var(--gold);      color: #1a1408; }
.next-btn:hover { opacity: 0.88; transform: translateY(-1px); }
.next-btn .btn-label { font-size: 0.88rem; font-weight: 500; }
.next-btn .btn-score { font-size: 0.68rem; opacity: 0.75; letter-spacing: 0.4px; }
.forfeit-btn {
flex: 1; padding: 15px; border-radius: 10px; border: 1px solid rgba(201,168,76,0.35);
background: rgba(201,168,76,0.06); color: var(--gold);
font-family: 'DM Sans', sans-serif; font-size: 0.88rem; cursor: pointer; transition: all 0.18s ease; white-space: nowrap;
}
.forfeit-btn:hover { background: rgba(201,168,76,0.12); }

/* SCORE */
.score-bar { display: flex; gap: 8px; width: 100%; max-width: 480px; margin-top: 6px; }
.score-pill { flex: 1; padding: 10px; border-radius: 8px; text-align: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
.score-pill span { display: block; font-size: 1.3rem; font-weight: 700; margin-bottom: 1px; }
.score-pill.her span { color: var(--accent-her); }
.score-pill.him span { color: var(--accent-him); }
.score-pill .label { font-size: 0.7rem; color: var(--muted); }

.forfeit-flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 100; }
.forfeit-flash.show { opacity: 1; }

.empty-state { text-align: center; padding: 36px 20px; color: var(--muted); width: 100%; }
.empty-state .emoji { font-size: 2.6rem; display: block; margin-bottom: 10px; }
.reset-btn { margin-top: 12px; padding: 10px 20px; border-radius: 8px; border: 1px solid var(--gold); background: transparent; color: var(--gold); font-family: 'DM Sans', sans-serif; cursor: pointer; font-size: 0.82rem; }
</style>

</head>
<body>
<div class="forfeit-flash" id="forfeitFlash"></div>

<header>
  <h1>Connect 🔥</h1>
  <p>Forfeit to Skip · 5 mins per round</p>
</header>

<div class="rules">
  <strong>How to play:</strong> Pick a player and a category (or Mix for surprise). They answer honestly — <strong>refuse</strong>, they forfeit. Hit 🚨 to track it. Start <strong>Light</strong>, build to <strong>Hot</strong>.
</div>

<div class="player-select">
<button class="player-btn her active" onclick="setPlayer('her')"><span class="cycle-arrow" onclick="cycleGender('her', -1); event.stopPropagation();">&#8249;</span> <span class="player-label">Her questions</span> <span class="cycle-arrow" onclick="cycleGender('her', 1); event.stopPropagation();">&#8250;</span></button>
<button class="player-btn him" onclick="setPlayer('him')"><span class="cycle-arrow" onclick="cycleGender('him', -1); event.stopPropagation();">&#8249;</span> <span class="player-label">His questions</span> <span class="cycle-arrow" onclick="cycleGender('him', 1); event.stopPropagation();">&#8250;</span></button>
</div>

<div class="cat-select">
  <button class="cat-btn light active" onclick="setCat('light')">
    <span class="cat-emoji">😂</span>Light<span class="cat-sub">Funny & silly</span>
  </button>
  <button class="cat-btn warm" onclick="setCat('warm')">
    <span class="cat-emoji">🕯️</span>Warm<span class="cat-sub">Nostalgic</span>
  </button>
  <button class="cat-btn hot" onclick="setCat('hot')">
    <span class="cat-emoji">🔥</span>Hot<span class="cat-sub">Deep & spicy</span>
  </button>
  <button class="cat-btn mix" onclick="setCat('mix')">
    <span class="cat-emoji">🎲</span>Mix<span class="cat-sub">Surprise me</span>
  </button>
</div>

<div class="progress-row">
  <div class="progress-pill light" onclick="setCat('light')"><span class="p-num" id="lightLeft">—</span>left</div>
  <div class="progress-pill warm"  onclick="setCat('warm')"><span class="p-num" id="warmLeft">—</span>left</div>
  <div class="progress-pill hot"   onclick="setCat('hot')"><span class="p-num" id="hotLeft">—</span>left</div>
  <div class="progress-pill mix"   onclick="setCat('mix')"><span class="p-num" id="mixLeft">—</span>left</div>
</div>

<div class="timer-wrap">
  <div class="timer-display">
    <div class="timer-number" id="timerDisplay">5:00</div>
    <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
    <div class="timer-controls">
      <button class="timer-btn" id="timerStartBtn" onclick="toggleTimer()">Start</button>
      <button class="timer-btn" onclick="resetTimer()">Reset</button>
    </div>
  </div>
</div>

<div class="card-area" id="cardArea"></div>

<div class="action-row">
<button class="next-btn light" id="nextBtn" onclick="nextCard()">
  <span class="btn-label">Next Question →</span>
  <span class="btn-score" id="btnScore">0 answered</span>
<button class="forfeit-btn" onclick="logforfeit(); nextCard();">🚨 Forfeit & Next</button>
</div>

<div class="score-bar">
  <div class="score-pill her"><span id="herforfeits">0</span><div class="label">Her forfeits</div></div>
  <div class="score-pill him"><span id="himforfeits">0</span><div class="label">His forfeits</div></div>
</div>

// ── STATE ─────────────────────────────────────────────────────
let currentPlayer = 'her';
let currentCat = 'light';
let herforfeitCount = 0;
let himforfeitCount = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Pools (shuffled) and indices per player/cat + mix
const pools = {
  her: {
    light: shuffle([...Q.light]),
    warm:  shuffle([...Q.warm]),
    hot:   shuffle([...Q.hot]),
  },
  him: {
    light: shuffle([...Q.light]),
    warm:  shuffle([...Q.warm]),
    hot:   shuffle([...Q.hot]),
  },
};

const seen = {
  her: { light: new Set(), warm: new Set(), hot: new Set() },
  him: { light: new Set(), warm: new Set(), hot: new Set() },
};

const indices = {
  her: { light: 0, warm: 0, hot: 0, mix: 0 },
  him: { light: 0, warm: 0, hot: 0, mix: 0 },
};

const mixPools = {
  her: [],
  him: [],
};

function buildMixPool(player) {
  let out = [];
  ['light', 'warm', 'hot'].forEach(cat => {
    pools[player][cat].forEach((q, i) => {
      if (!seen[player][cat].has(i)) out.push({ q, cat, idx: i });
    });
  });
  mixPools[player] = shuffle(out);
}

buildMixPool('her');
buildMixPool('him');

// ── TIMER ─────────────────────────────────────────────────────
const TIMER_TOTAL = 300;
let timerRemaining = TIMER_TOTAL;
let timerRunning = false;
let timerInterval = null;

function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('timerStartBtn').textContent = 'Start';
  } else {
    if (timerRemaining <= 0) timerRemaining = TIMER_TOTAL;
    timerRunning = true;
    document.getElementById('timerStartBtn').textContent = 'Pause';
    timerInterval = setInterval(() => {
      timerRemaining--;
      updateTimerDisplay();
      if (timerRemaining <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById('timerStartBtn').textContent = 'Done!';
      }
    }, 1000);
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerRemaining = TIMER_TOTAL;
  document.getElementById('timerStartBtn').textContent = 'Start';
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  const el = document.getElementById('timerDisplay');
  el.textContent = `${m}:${String(s).padStart(2,'0')}`;
  el.className = 'timer-number' + (timerRemaining <= 30 && timerRemaining > 0 ? ' urgent' : '');
  const pct = (timerRemaining / TIMER_TOTAL) * 100;
  const bar = document.getElementById('timerBar');
  bar.style.width = pct + '%';
  bar.style.background = pct > 50 ? 'var(--gold)' : pct > 20 ? 'var(--warm-col)' : 'var(--hot-col)';
}

// ── RENDER ────────────────────────────────────────────────────
const genderLabels = ['Her', 'His', 'Their'];
const genderState  = { her: 0, him: 1 };

function cycleGender(player, dir) {
  genderState[player] = (genderState[player] + dir + genderLabels.length) % genderLabels.length;
  const label = genderLabels[genderState[player]];
  document.querySelector(`.player-btn.${player} .player-label`).textContent = label + ' questions';
  setPlayer(player);
}
 function setPlayer(p) {
  currentPlayer = p;
  document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.player-btn.${p}`).classList.add('active');
  renderCard();
  updateProgress();
  updateBtnScore();
}

function setCat(c) {
  currentCat = c;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.cat-btn.${c}`).classList.add('active');
  const btn = document.getElementById('nextBtn');
  btn.className = `next-btn ${c}`;
  renderCard();
}

function getCardPool() {
  if (currentCat === 'mix') return mixPools[currentPlayer];
  return pools[currentPlayer][currentCat];
}

function getIdx() { return indices[currentPlayer][currentCat]; }
function setIdx(v) { indices[currentPlayer][currentCat] = v; }

function markSeen(player, cat, poolIdx) {
  seen[player][cat].add(poolIdx);
}

function updateProgress() {
  ['light','warm','hot'].forEach(cat => {
    const left = Math.max(0, pools[currentPlayer][cat].length - indices[currentPlayer][cat]);
    document.getElementById(cat + 'Left').textContent = left;
  });
  document.getElementById('mixLeft').textContent = mixPools[currentPlayer].length - getIdx() < 0 ? 0 : mixPools[currentPlayer].length;
  updateBtnScore();
}

function updateBtnScore() {
  const idx = getIdx();
  const forfeits = currentPlayer === 'her' ? herforfeitCount : himforfeitCount;
  const answered = Math.max(0, idx - forfeits);
  document.getElementById('btnScore').textContent = answered + ' answered';
}

const catNames = { light: '😂 Light', warm: '🕯️ Warm', hot: '🔥 Hot', mix: '🎲 Mix' };

function renderCard() {
  const area = document.getElementById('cardArea');
  const pool = getCardPool();
  const idx  = getIdx();
  const playerLabel = currentPlayer === 'her' ? '♀ Her turn' : '♂ His turn';

  if (idx >= pool.length) {
    area.innerHTML = `<div class="empty-state">
      <span class="emoji">✨</span>
      <p style="color:var(--muted);font-size:0.88rem">All ${catNames[currentCat]} questions done!<br>Try another category.</p>
      <button class="reset-btn" onclick="resetCat()">Reshuffle this category</button>
    </div>`;
    return;
  }

  let q, displayCat;
  if (currentCat === 'mix') {
    q = pool[idx].q;
    displayCat = catNames[pool[idx].cat];
  } else {
    q = pool[idx];
    displayCat = catNames[currentCat];
  }

  const cardClass = currentCat === 'mix'
    ? (pool[idx].cat + '-card')
    : (currentCat + '-card');

  area.innerHTML = `
    <div class="card ${cardClass}" onclick="nextCard()">
      <div>
        <div class="card-top">
          <div class="card-label">${playerLabel}</div>
          <span class="cat-badge">${displayCat}</span>
        </div>
        <div class="question-text">${q}</div>
      </div>
      <div class="card-footer">
        <span class="card-counter">${idx + 1} / ${pool.length}</span>
        <span class="card-hint">tap card or button →</span>
      </div>
    </div>`;
}

function nextCard() {
  const pool = getCardPool();
  const idx  = getIdx();
  if (idx < pool.length) {
    if (currentCat === 'mix') {
      const item = pool[idx];
      markSeen(currentPlayer, item.cat, item.idx);
    } else {
      markSeen(currentPlayer, currentCat, idx);
    }
    buildMixPool(currentPlayer);
  }
  setIdx(Math.min(idx + 1, pool.length));
  renderCard();
  updateProgress();
}

function resetCat() {
  if (currentCat === 'mix') {
    ['light','warm','hot'].forEach(cat => seen[currentPlayer][cat].clear());
    ['light','warm','hot'].forEach(cat => indices[currentPlayer][cat] = 0);
    pools[currentPlayer].light = shuffle([...Q.light]);
    pools[currentPlayer].warm  = shuffle([...Q.warm]);
    pools[currentPlayer].hot   = shuffle([...Q.hot]);
    buildMixPool(currentPlayer);
    indices[currentPlayer] = { light: 0, warm: 0, hot: 0 };
  } else {
    seen[currentPlayer][currentCat] = new Set();
    pools[currentPlayer][currentCat] = shuffle([...Q[currentCat]]);
    indices[currentPlayer][currentCat] = 0;
    buildMixPool(currentPlayer);
  }
  renderCard();
  updateProgress();
}

function logforfeit() {
  const flash = document.getElementById('forfeitFlash');
  if (currentPlayer === 'her') {
    herforfeitCount++;
    document.getElementById('herforfeits').textContent = herforfeitCount;
    flash.style.background = 'rgba(232,69,96,0.18)';
  } else {
    himforfeitCount++;
    document.getElementById('himforfeits').textContent = himforfeitCount;
    flash.style.background = 'rgba(69,114,232,0.18)';
  }
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 350);
}

// INIT
updateTimerDisplay();
renderCard();
updateProgress();
</script>
